# nginx on the KMUTT server (CIT_TTA2027), installed in C:\nginx.
# Path in the repo: deploy/kmutt/nginx/nginx.conf  ->  copied to C:\nginx\conf\nginx.conf
#
#   browser --https--> university proxy (mainwebreverse.kmutt.ac.th, holds the certificate)
#           --http:80--> this nginx --> Login Portal on 127.0.0.1:3001
#
# HTTPS is handled by the university proxy, so this file only listens on plain http port 80.
# After editing:  cd C:\nginx; .\nginx.exe -t; .\nginx.exe -s reload

worker_processes  1;
error_log  logs/error.log;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    keepalive_timeout  65;

    # Shows who called (remote_addr = the university proxy) and the real visitor (xff).
    log_format  main  '$remote_addr [$time_local] "$host" "$request" $status $body_bytes_sent '
                      'xff="$http_x_forwarded_for" rt=$request_time';
    access_log  logs/access.log  main;

    # Largest upload through nginx. The portal's own limits are lower (work files 50 MB).
    client_max_body_size  60m;

    # Login Portal: tta2027.kmutt.ac.th.
    # default_server: also answers when the proxy sends another Host (e.g. the bare IP).
    server {
        listen       80 default_server;
        server_name  tta2027.kmutt.ac.th;

        location / {
            proxy_pass          http://127.0.0.1:3001;
            proxy_http_version  1.1;
            proxy_set_header    Host               $host;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $http_x_forwarded_proto;
            proxy_read_timeout  120s;
            proxy_send_timeout  120s;
        }
    }

    # TTA Landing Page (deploy/kmutt/DEPLOY_STEP_BY_STEP.md, Variant 2).
    # To turn it on: remove the leading # of every line in this block and set <landing-domain>.
    #
    # server {
    #     listen       80;
    #     server_name  <landing-domain>;
    #     root         C:/sites/tta-landing/site;
    #     index        index.html;
    #
    #     gzip         on;
    #     gzip_types   text/css application/javascript application/json image/svg+xml;
    #
    #     # Hashed Vite bundles (the build's assetsDir is "static"): cache for a year.
    #     location /static/ {
    #         add_header  Cache-Control "public, max-age=31536000, immutable";
    #         try_files   $uri =404;
    #     }
    #     # Images from public/ keep their names: cache a week.
    #     location ~ ^/(assets|sponsors|banners|logos)/ {
    #         add_header  Cache-Control "public, max-age=604800";
    #         try_files   $uri =404;
    #     }
    #     # index.html: always re-check, so a new build shows at once.
    #     location / {
    #         add_header  Cache-Control "no-cache";
    #         try_files   $uri $uri/ /index.html;
    #     }
    # }

    # Another site later: copy this block, set its domain, and remove the leading #.
    # A static site (built files in C:\sites\<project>\site):
    #
    # server {
    #     listen       80;
    #     server_name  <other-name>.kmutt.ac.th;
    #     root         C:/sites/<project>/site;
    #     index        index.html;
    #     location / {
    #         try_files $uri $uri/ /index.html;
    #     }
    # }
    #
    # Another Node app on its own port (e.g. 3002):
    #
    # server {
    #     listen       80;
    #     server_name  <other-name>.kmutt.ac.th;
    #     location / {
    #         proxy_pass        http://127.0.0.1:3002;
    #         proxy_set_header  Host             $host;
    #         proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
    #     }
    # }
}
